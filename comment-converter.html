<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment Converter</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #20262e; font: 15px/1.5 system-ui, sans-serif; }
    header { background: #fff; border-bottom: 1px solid #d9dfe5; padding: 22px 24px; }
    header div, main { max-width: 1200px; margin: auto; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    main { padding: 24px; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    label { display: grid; gap: 8px; font-weight: 600; min-width: 0; }
    textarea { width: 100%; height: 55vh; min-height: 260px; padding: 14px; resize: vertical; border: 1px solid #bcc6d0; border-radius: 6px; background: #fff; color: #20262e; font: 14px/1.6 ui-monospace, monospace; }
    textarea:focus { outline: 2px solid #087f8c; outline-offset: 2px; }
    textarea[readonly] { background: #fcfdfd; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    button { padding: 9px 16px; border: 1px solid #bcc6d0; border-radius: 6px; background: #fff; color: #20262e; font: 600 14px system-ui, sans-serif; cursor: pointer; }
    button.primary { background: #087f8c; border-color: #087f8c; color: #fff; }
    button:hover { filter: brightness(.95); }
    button:focus-visible { outline: 2px solid #087f8c; outline-offset: 3px; }
    #status { color: #526170; font-size: 14px; }
    @media (max-width: 700px) { .fields { grid-template-columns: minmax(0, 1fr); } main { padding: 16px; } textarea { height: 32vh; min-height: 200px; } }
  </style>
</head>
<body>
  <header><div><h1>Comment Converter</h1></div></header>
  <main>
    <div class="fields">
      <label for="input">Input text<textarea id="input" placeholder="Paste comment text here..." spellcheck="false"></textarea></label>
      <label for="output">Converted output<textarea id="output" placeholder="Converted text appears here..." readonly spellcheck="false"></textarea></label>
    </div>
    <div class="actions">
      <button class="primary" id="convert" type="button">Convert</button>
      <button id="copy" type="button">Copy Result</button>
      <button id="clear" type="button">Clear</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </main>
  <script>
    function convertCommentText(input) {
      const separator = "-----------------";
      const authorHeader = /^\s*[^\r\n()]+\s+\([^\r\n()]+\)\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s*$/;
      const output = [];
      for (const line of input.split(/\r\n|\n|\r/)) {
        if (authorHeader.test(line) && output.at(-1)?.trim() !== separator) {
          output.push(separator);
        }
        output.push(line);
      }
      return output.join("\n");
    }

    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    document.getElementById("convert").addEventListener("click", () => {
      output.value = convertCommentText(input.value);
      status.textContent = output.value ? "Converted." : "No input yet.";
    });
    document.getElementById("copy").addEventListener("click", async () => {
      if (!output.value) {
        status.textContent = "Nothing to copy.";
        return;
      }
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = "Copied.";
      } catch {
        output.focus();
        output.select();
        output.setSelectionRange(0, output.value.length);
        try {
          status.textContent = document.execCommand("copy") ? "Copied." : "Text selected. Use your browser's Copy command.";
        } catch {
          status.textContent = "Text selected. Use your browser's Copy command.";
        }
      }
    });
    document.getElementById("clear").addEventListener("click", () => {
      input.value = "";
      output.value = "";
      status.textContent = "Cleared.";
      input.focus();
    });
  </script>
</body>
</html>
